<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monetizar Enlaces - Linkvertise</title>
    <link rel="stylesheet" href="style.css">

    <!-- Script oficial de Linkvertise -->
    <script src="https://publisher.linkvertise.com/cdn/linkvertise.js"></script>
    <script>
      // Inicializa tu API con tu ID
      linkvertise(1285228, {
        whitelist: [], // Si quieres solo ciertos dominios, los pones aquí
        blacklist: []
      });
    </script>
</head>
<body>
    <main>
        <h1>Monetizar Enlaces</h1>
        <form id="linkForm">
            <label for="originalLink">Enlace original:</label>
            <input type="url" id="originalLink" placeholder="https://..." required>
            <button type="submit">Monetizar</button>
        </form>

        <div id="resultContainer" style="display:none;">
            <h2>Enlace Monetizado:</h2>
            <input type="text" id="monetizedLink" readonly>
            <button id="copyBtn">Copiar</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
